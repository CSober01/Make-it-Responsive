<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse by Job Categories</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <section class="categories">
        <h2 class="categories__title">
            Browse by<br />
            <span class="hl">Job</span> Categories
        </h2>

        <div class="categories__grid">

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-bullhorn"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Digital Marketing</h3>
                        <p class="card__count">143 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-pen-nib"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Art &amp; Design</h3>
                        <p class="card__count">110 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card is-active">
                <div class="card__icon"><i class="fa-solid fa-dollar-sign"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Accounting</h3>
                        <p class="card__count">158 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-camera"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Photography</h3>
                        <p class="card__count">95 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-pen-to-square"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Copy Writing</h3>
                        <p class="card__count">113 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-headphones"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Music</h3>
                        <p class="card__count">55 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card__icon"><i class="fa-solid fa-person-walking-luggage"></i></div>
                <div class="card__bottom">
                    <div>
                        <h3 class="card__name">Human Resouces</h3>
                        <p class="card__count">25 Jobs Opened</p>
                    </div>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

            <a href="#" class="card card--explore">
                <div class="card__bottom">
                    <h3 class="card__name">Explore<br />30 More<br />Categories</h3>
                    <i class="fa-solid fa-arrow-right card__arrow"></i>
                </div>
            </a>

        </div>
    </section>

</body>

</html>
