<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse by Job Categories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --navy: #173f5f;
      --orange: #ff7f41;
      --orange-soft: #fff1ea;
      --gray-bg: #f7f8fa;
      --border: #eef0f3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Poppins", sans-serif;
      color: var(--navy);
      background: #fff;
    }

    /* ---------- Section (Desktop 1920) ---------- */
    .categories {
      padding: 90px 20px 160px;
    }

    .categories__title {
      text-align: center;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 56px;
    }

    .categories__title .hl {
      background: linear-gradient(transparent 72%, rgba(255, 127, 65, .55) 72%);
    }

    .categories__grid {
      max-width: 1420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    /* ---------- Card ---------- */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 270px;
      padding: 30px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
      transition: background .25s ease;
    }

    .card__icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--orange-soft);
      color: var(--orange);
      display: grid;
      place-items: center;
      font-size: 26px;
      transition: background .25s ease, color .25s ease, box-shadow .25s ease;
    }

    .card__bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .card__name {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }

    .card__count {
      font-size: 14px;
      font-weight: 400;
      margin-top: 8px;
    }

    .card__arrow { font-size: 16px; }

    /* Hover / active state (ตรงกับการ์ด Accounting ใน Design) */
    .card:hover,
    .card.is-active {
      background: var(--gray-bg);
      border-color: var(--gray-bg);
    }
    .card:hover .card__icon,
    .card.is-active .card__icon {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 10px 20px rgba(255, 127, 65, .35);
    }

    /* ---------- Explore card ---------- */
    .card--explore {
      background-color: var(--orange);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='340' height='270' viewBox='0 0 340 270' fill='none' stroke='white' stroke-opacity='.25'><path d='M0 30 C60 0 100 60 170 30 S280 0 340 40'/><path d='M0 55 C60 25 100 85 170 55 S280 25 340 65'/><path d='M0 215 C60 185 100 245 170 215 S280 185 340 225'/><path d='M0 245 C60 215 100 275 170 245 S280 215 340 255'/></svg>");
      background-size: cover;
      background-position: center;
      border-color: var(--orange);
      color: #fff;
      justify-content: center;
    }
    .card--explore:hover { background-color: #f26f2e; border-color: #f26f2e; }

    .card--explore .card__bottom {
      justify-content: flex-start;
      align-items: center;
      gap: 24px;
    }
    .card--explore .card__name {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.5;
    }

    /* ---------- Tablet ---------- */
    @media (max-width: 1199px) {
      .categories__grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        max-width: 760px;
      }
    }

    /* ---------- Mobile (375) ---------- */
    @media (max-width: 767px) {
      .categories {
        padding: 48px 20px 60px;
      }

      .categories__title {
        font-size: 28px;
        margin-bottom: 36px;
      }

      .categories__grid {
        grid-template-columns: 1fr;
        gap: 24px;
        max-width: none;
      }

      .card {
        min-height: 210px;
        padding: 24px;
      }

      .card__icon {
        width: 64px;
        height: 64px;
        font-size: 22px;
      }

      .card__name { font-size: 18px; }
      .card__count { font-size: 13px; margin-top: 6px; }

      .card--explore { min-height: 200px; }
      .card--explore .card__name { font-size: 18px; }
    }
  </style>
</head>
<body>

  <section class="categories">
    <h2 class="categories__title">
      Browse by<br />
      <span class="hl">Job</span> Categories
    </h2>

    <div class="categories__grid">

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-bullhorn"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Digital Marketing</h3>
            <p class="card__count">143 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-pen-nib"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Art &amp; Design</h3>
            <p class="card__count">110 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card is-active">
        <div class="card__icon"><i class="fa-solid fa-dollar-sign"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Accounting</h3>
            <p class="card__count">158 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-camera"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Photography</h3>
            <p class="card__count">95 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-pen-to-square"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Copy Writing</h3>
            <p class="card__count">113 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-headphones"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Music</h3>
            <p class="card__count">55 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card">
        <div class="card__icon"><i class="fa-solid fa-person-walking-luggage"></i></div>
        <div class="card__bottom">
          <div>
            <h3 class="card__name">Human Resouces</h3>
            <p class="card__count">25 Jobs Opened</p>
          </div>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

      <a href="#" class="card card--explore">
        <div class="card__bottom">
          <h3 class="card__name">Explore<br />30 More<br />Categories</h3>
          <i class="fa-solid fa-arrow-right card__arrow"></i>
        </div>
      </a>

    </div>
  </section>

</body>
</html>
